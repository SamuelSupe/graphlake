name: GraphLake regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 3
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - run: rustup override set 1.97.1
      - run: cargo fmt --all --check
      - uses: actions/setup-node@v6
        with:
          node-version: "24.22.1"
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/regression"
          {
          npm --prefix web ci
          npm --prefix web run build
          npm --prefix web test
          } 2>&1 | tee "$RUNNER_TEMP/regression/web.log"
      - shell: bash
        run: cargo test --locked --features admin --lib --bins --test engine --test admin 2>&1 | tee "$RUNNER_TEMP/regression/rust.log"
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16 prometheus
      - shell: bash
        run: |
          export PYTHONDONTWRITEBYTECODE=1
          {
            python3 tests/monitoring_test.py
            promtool check rules deploy/prometheus-rules.yaml
            promtool test rules tests/prometheus-rules-test.yml
          } 2>&1 | tee "$RUNNER_TEMP/regression/monitoring.log"
      - run: docker compose -f tests/production-compose.yml up -d --wait --wait-timeout 120
      - shell: bash
        run: bash tests/production-services.sh 2>&1 | tee "$RUNNER_TEMP/regression/services.log"
      - name: Record the exact source, fixtures and test results
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            printf 'git_base=%s\n' "$GITHUB_SHA"
            sha256sum Cargo.lock web/package-lock.json tests/production-compose.yml
            rustc --version
            node --version
            (cd "$RUNNER_TEMP/regression" && sha256sum ./*.log)
          } > "$RUNNER_TEMP/regression/receipt.txt"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: graphlake-regression
          path: ${{ runner.temp }}/regression
          if-no-files-found: error
      - if: always()
        run: docker compose -f tests/production-compose.yml down -v

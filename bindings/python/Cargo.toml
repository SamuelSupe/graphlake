[package]
name = "graphlake-python"
version = "1.1.1"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
name = "graphlake"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
arrow-pyarrow = "59.3"
futures = "0.3"
graphlake-engine = { package = "graphlake", path = "../.." }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

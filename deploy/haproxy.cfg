# HAProxy 2.6+ on the ingress host. Replace the public hostname and certificate.
# The high loopback ports below are private forwards to each Coordinator.
global
    log /dev/log local0

defaults
    log global
    timeout connect 2s
    timeout client  1m
    timeout server  1m
    retries 0

frontend graphlake_https
    mode http
    bind :443 ssl crt /etc/haproxy/certs/graphlake.pem alpn h2,http/1.1
    http-response set-header Strict-Transport-Security "max-age=31536000"
    http-request del-header X-GraphLake-Proxy-User
    http-request del-header X-GraphLake-Proxy-Secret
    http-request set-header X-GraphLake-Client-IP %[src]
    http-request deny if { path /coordinator/active /coordinator/recovery }
    acl recovery_rpc path /recovery/status /recovery/check /recovery/verify /recovery/backups /recovery/import
    http-request del-header X-GraphLake-Recovery-Token unless recovery_rpc
    use_backend graphlake_recovery if recovery_rpc
    use_backend graphlake_recovery if { path /recovery /recovery/ }
    use_backend graphlake_recovery if { path_beg /assets/ } { nbsrv(graphlake_coordinator) eq 0 }
    default_backend graphlake_coordinator

backend graphlake_coordinator
    mode http
    timeout tunnel 1m
    option httpchk
    http-check send meth GET uri /coordinator/active ver HTTP/1.1 hdr Host graphlake.example
    http-check expect status 200
    default-server inter 500ms fall 1 rise 1 on-marked-down shutdown-sessions
    server primary 127.0.0.1:17337 check
    server standby 127.0.0.1:27337 check backup

# Probe a fenced recovery site through the actual HTTPS frontend before the VIP
# is enabled. Only the recovery page, its assets and token-scoped APIs use this route.
backend graphlake_recovery
    mode http
    timeout server 5m
    option httpchk
    http-check send meth GET uri /coordinator/recovery ver HTTP/1.1 hdr Host graphlake.example
    http-check expect status 200
    default-server inter 500ms fall 1 rise 1
    server primary 127.0.0.1:17337 check
    server standby 127.0.0.1:27337 check backup

frontend graphlake_bolt
    mode tcp
    bind :7687 ssl crt /etc/haproxy/certs/graphlake.pem
    default_backend graphlake_coordinator_bolt

backend graphlake_coordinator_bolt
    mode tcp
    option tcp-check
    # The Coordinator checks leadership before answering the Bolt handshake.
    tcp-check connect
    tcp-check send-binary 6060B01700000405000000000000000000000000
    tcp-check expect binary 00000405
    default-server inter 500ms fall 1 rise 1 on-marked-down shutdown-sessions
    server primary 127.0.0.1:17687 check
    server standby 127.0.0.1:27687 check backup

# Loopback-only readiness for the ingress VIP. The selected backend must
# answer the health check on that route. Bolt uses its own protocol handshake.
frontend graphlake_ingress_ready
    mode http
    bind 127.0.0.1:19403
    http-request return status 503 if { path /bolt } { nbsrv(graphlake_coordinator_bolt) eq 0 }
    http-request return status 503 unless { path /https /bolt }
    # Server health is optimistic before HAProxy's first check after a reload.
    # Require the live Coordinator gate before reporting either route ready.
    http-request set-header Host graphlake.example
    http-request set-path /coordinator/active
    default_backend graphlake_coordinator

# Install on two ingress hosts on the same routed L2 segment.
# On the second host swap unicast_src_ip and unicast_peer, and use priority 90.
# Open IP protocol 112 between the ingress hosts.
global_defs {
    enable_script_security
    script_user root
}

vrrp_script graphlake_ingress_ready {
    script "/usr/local/libexec/graphlake-ingress-ready"
    interval 1
    timeout 1
    init_fail
    fall 2
    rise 1
    weight 0
}

vrrp_instance GRAPHLAKE {
    state BACKUP
    interface eth0
    virtual_router_id 73
    priority 100
    advert_int 1
    nopreempt
    unicast_src_ip 192.0.2.21
    unicast_peer {
        192.0.2.22
    }
    virtual_ipaddress {
        192.0.2.20/24 dev eth0
    }
    track_script {
        graphlake_ingress_ready
    }
}

[package]
edition = "2024"
rust-version = "1.85"
name = "leiden-rs"
version = "0.8.1"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "High-performance Leiden community detection algorithm for graphs in Rust"
readme = "README.md"
keywords = [
    "community-detection",
    "graph",
    "clustering",
    "leiden",
    "modularity",
]
categories = [
    "algorithms",
    "data-structures",
    "science",
]
license = "MIT OR Apache-2.0"
repository = "https://gitcode.com/lileeei/leiden-rs"

[features]
cli = ["dep:clap"]
default = [
    "cli",
    "rayon",
    "gryf",
]
gryf = ["dep:gryf"]
petgraph = ["dep:petgraph"]
rayon = ["dep:rayon"]
serde = ["dep:serde"]
snap-tests = []
wasm = [
    "dep:wasm-bindgen",
    "dep:getrandom",
]

[lib]
name = "leiden_rs"
path = "src/lib.rs"

[dependencies.clap]
version = "4"
features = ["derive"]
optional = true

[dependencies.getrandom]
version = "0.3"
features = ["wasm_js"]
optional = true

[dependencies.gryf]
version = "0.2"
optional = true

[dependencies.petgraph]
version = "0.8"
optional = true

[dependencies.rand]
version = "0.9"

[dependencies.rayon]
version = "1.10"
optional = true

[dependencies.rustc-hash]
version = "2"

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[dependencies.thiserror]
version = "2"

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

